services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: qloo
      POSTGRES_PASSWORD: qloo_local_dev
      POSTGRES_DB: assembly
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - assembly_postgres:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qloo -d assembly"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  assembly_postgres:
