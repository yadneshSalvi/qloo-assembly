name: Verify ASSEMBLY

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: qloo
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: assembly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qloo -d assembly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://qloo:local_ci_only@127.0.0.1:5432/assembly_test
      DATABASE_POOL_MAX: "4"
      ASSEMBLY_DB_TEST: "1"
      APP_ORIGIN: http://127.0.0.1:3102
      PORT: "3102"
      WORKER_PORT: "3103"
      WORKER_AUTH_MODE: local
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test
      - run: pnpm exec tsx scripts/migrate.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production browser flows without provider credentials
        shell: bash
        run: |
          pnpm start > /tmp/assembly-ci-web.log 2>&1 &
          assembly_web_pid=$!
          PORT=3103 pnpm exec tsx apps/worker/index.ts > /tmp/assembly-ci-worker.log 2>&1 &
          assembly_worker_pid=$!
          trap 'kill "$assembly_web_pid" "$assembly_worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3102/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3102/api/health > /dev/null
          pnpm test:e2e
